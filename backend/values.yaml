namespace: lmw-recovery
env: production
allowedOrigin: https://www.lmwrecovery.co.uk
allowCredentials: false
frontend_url: https://www.lmwrecovery.co.uk
replicaCount: 1
platform: linux/amd64
image:
  pullPolicy: Always
storage:
  storageClass: standard
api:
  image:
    repository: index.docker.io/lmwcode/lmw-recovery-backend
    # tag: v.<+pipeline.sequenceId>
    # tag: <+serviceVariables.tag>
    tag: v1.2.2
  host: api.lmwrecovery.co.uk
  port: 8082
  path: /api/
  type: ClusterIP
  protocol: TCP
  pathType: Prefix
  applicationType: backend
images:
  directory: images
database:
  name: lmwrecovery
  user: lmwcode
  port: 5432
  type: ClusterIP
  protocol: TCP
  sslMode: disable
  host: 217.154.57.170
webserver:
  host: www.lmwrecovery.co.uk
smtp:
  host: smtp.ionos.co.uk
  port: 587
  username: info@lmwrecovery.co.uk
  from: info@lmwrecovery.co.uk
  to: info@lmwrecovery.co.uk
admin:
  email: info@lmwrecovery.co.uk
seedUser:
  email: warren_laura@yahoo.co.uk
livenessProbe:
  endpoint: /api/health/live
  initialDelaySeconds: 60
  timeoutSeconds: 5
  periodSeconds: 120
  failureThreshold: 3
  successThreshold: 1
readinessProbe:
  endpoint: /api/health/ready
  initialDelaySeconds: 60
  timeoutSeconds: 5
  periodSeconds: 120
  failureThreshold: 3
  successThreshold: 1
