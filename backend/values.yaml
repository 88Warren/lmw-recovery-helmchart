# ── Deployment basics ─────────────────────────────────────────────────────────
namespace: lmw-recovery
# APP_ENV for the Go backend (config.go reads APP_ENV; "production" → .env.production,
# which is absent in the container so real env vars are used).
env: production
replicaCount: 1
platform: linux/amd64

image:
  pullPolicy: Always

# ── API container ─────────────────────────────────────────────────────────────
api:
  image:
    repository: index.docker.io/lmwcode/lmw-recovery-backend
    tag: v1.2.2
  host: api.lmwrecovery.co.uk
  # Must match the Dockerfile EXPOSE and the Go app's default PORT.
  port: 8080
  path: /api/
  type: ClusterIP
  protocol: TCP
  pathType: Prefix
  applicationType: backend

# CORS: frontend origin(s) the Go app allows (config.go → FRONTEND_ORIGIN).
# Comma-separated; the API echoes back whichever matches the request. Include
# both the canonical apex and the www alias so calls work during the www→apex
# redirect and if anyone lands on www directly.
frontendOrigin: https://lmwrecovery.co.uk,https://www.lmwrecovery.co.uk

# Site origin Stripe redirects back to after Checkout (success/cancel pages).
# Must be a SINGLE URL (not a list) — use the canonical apex; www 301s to it.
# Defaults to frontendOrigin when empty, so set it explicitly now that
# frontendOrigin is a comma-separated list.
publicBaseURL: https://lmwrecovery.co.uk

# Stripe non-secret config.
stripe:
  # Recurring Price ID (price_…) for the £80/month Maintenance Plan subscription,
  # from the Stripe product catalogue. Required for maintenance subscriptions.
  maintenancePriceId: price_1URvQf4IHQd6L6Kskj7MBqWq

# ── Database (SQLite on a persistent volume) ──────────────────────────────────
# The Go backend uses an embedded SQLite file, not Postgres. The file lives on a
# PersistentVolume mounted at /data (matches the Dockerfile's DB_PATH=/data/lmw.db).
database:
  path: /data/lmw.db

storage:
  # Cluster uses k3s local-path provisioner (the default StorageClass).
  storageClass: local-path
  size: 1Gi

# ── SMTP (Ionos) ──────────────────────────────────────────────────────────────
smtp:
  host: smtp.ionos.co.uk
  port: 587
  username: info@lmwrecovery.co.uk
  from: LMW Recovery <info@lmwrecovery.co.uk>
  to: info@lmwrecovery.co.uk

# ── Studio location (shown in the booking confirmation email) ─────────────────
# Leave address empty to keep the generic "Full address sent separately." line.
# what3words may include or omit the leading /// — rendered as a clickable link.
studio:
  address: 45 Greenmeadow Ct, Llantrisant, Pontyclun CF72 8JH
  what3words: portfolio.broken.lorry

# ── Owner booking notifications (optional, free) ──────────────────────────────
# Telegram is recommended (free, no limits). The chat ID is your personal
# numeric chat ID (not the bot's). The bot TOKEN is a secret → see secrets below.
telegram:
  # Quote the chat ID so YAML keeps it an exact string — an unquoted number can
  # be parsed as a float and rendered as scientific notation (e.g. 7.07e+09),
  # which Telegram rejects.
  chatId: "7077156477"

# ── Brevo (optional — health questionnaire automation) ────────────────────────
# Leave apiKey empty to disable. templateId/listId are only used when apiKey is set.
brevo:
  templateId: ""
  listId: ""

# ── Secrets ───────────────────────────────────────────────────────────────────
# These are rendered into the Kubernetes Secret by templates/secrets.yaml.
# DO NOT commit real values here. Supply them at deploy time, e.g.:
#   helm upgrade ... --set secrets.smtpPassword=... --set secrets.adminToken=...
# or via a separate values file that is git-ignored:
#   helm upgrade ... -f secrets.prod.yaml
#
# recaptchaSecret is intentionally empty: reCAPTCHA was removed from the frontend,
# so the backend must skip verification (config.go treats "" as "no verification").
secrets:
  smtpPassword: ""
  adminToken: ""
  stripeSecretKey: ""
  stripeWebhookSecret: ""
  brevoApiKey: ""
  recaptchaSecret: ""
  # Telegram bot token from @BotFather (treat as a secret).
  telegramBotToken: ""

# ── Health probes (Go app serves GET /health) ─────────────────────────────────
livenessProbe:
  endpoint: /health
  initialDelaySeconds: 15
  timeoutSeconds: 5
  periodSeconds: 30
  failureThreshold: 3
  successThreshold: 1
readinessProbe:
  endpoint: /health
  initialDelaySeconds: 10
  timeoutSeconds: 5
  periodSeconds: 20
  failureThreshold: 3
  successThreshold: 1
