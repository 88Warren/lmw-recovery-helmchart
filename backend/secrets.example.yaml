# Copy this to secrets.prod.yaml (git-ignored) and fill in REAL values, then:
#   helm upgrade lmwrecovery-backend . -n lmw-recovery -f secrets.prod.yaml --reuse-values
#
# Only set what you actually use. Leave a value empty ("") to omit that key
# from the Kubernetes Secret entirely.
secrets:
  # Required for sending booking/contact emails via Ionos SMTP.
  smtpPassword: "your-ionos-smtp-password"

  # Required to authenticate the admin dashboard (config.go: ADMIN_TOKEN).
  # Generate a strong one with: openssl rand -hex 32
  adminToken: "replace-with-a-strong-random-token"

  # Required to take online payments for bookings.
  #   stripeSecretKey:    sk_live_… (sk_test_… in a test deploy) from
  #                       dashboard.stripe.com → Developers → API keys.
  #   stripeWebhookSecret: whsec_… — created when you add the webhook endpoint
  #                       https://api.lmwrecovery.co.uk/api/stripe/webhook in
  #                       dashboard.stripe.com → Developers → Webhooks, subscribed
  #                       to the checkout.session.completed event.
  stripeSecretKey: ""
  stripeWebhookSecret: ""

  # Optional — Brevo health-questionnaire automation.
  brevoApiKey: ""

  # Leave EMPTY. reCAPTCHA was removed from the frontend; a non-empty value here
  # makes the backend reject every contact-form submission (missing token).
  recaptchaSecret: ""

  # Optional — Telegram booking alerts. Token from @BotFather (keep secret).
  # The chat ID is NOT secret and is set via --set telegram.chatId=... (or
  # values), not here.
  telegramBotToken: ""
