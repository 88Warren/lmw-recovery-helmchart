apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-secrets
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: {{ .Release.Name }}
  annotations:
    meta.helm.sh/release-name: {{ .Release.Name }}
    meta.helm.sh/release-namespace: {{ .Values.namespace }}
type: Opaque
# Values come from .Values.secrets, which MUST be supplied at deploy time
# (--set or a git-ignored values file) and NEVER committed with real values.
# stringData lets us provide plain text; Kubernetes base64-encodes it on apply.
stringData:
  {{- if .Values.secrets.smtpPassword }}
  SMTP_PASSWORD: {{ .Values.secrets.smtpPassword | quote }}
  {{- end }}
  {{- if .Values.secrets.adminToken }}
  ADMIN_TOKEN: {{ .Values.secrets.adminToken | quote }}
  {{- end }}
  {{- if .Values.secrets.stripeSecretKey }}
  STRIPE_SECRET_KEY: {{ .Values.secrets.stripeSecretKey | quote }}
  {{- end }}
  {{- if .Values.secrets.stripeWebhookSecret }}
  STRIPE_WEBHOOK_SECRET: {{ .Values.secrets.stripeWebhookSecret | quote }}
  {{- end }}
  {{- if .Values.secrets.brevoApiKey }}
  BREVO_API_KEY: {{ .Values.secrets.brevoApiKey | quote }}
  {{- end }}
  {{- if .Values.secrets.recaptchaSecret }}
  RECAPTCHA_SECRET: {{ .Values.secrets.recaptchaSecret | quote }}
  {{- end }}
