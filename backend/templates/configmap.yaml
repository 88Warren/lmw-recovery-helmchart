apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-configmap
  namespace: {{ .Values.namespace }}
data:
  # Keys below MUST match the names read in backend/internal/config/config.go.
  APP_ENV: "{{ .Values.env }}"
  PORT: "{{ .Values.api.port }}"
  DB_PATH: "{{ .Values.database.path }}"
  FRONTEND_ORIGIN: "{{ .Values.frontendOrigin }}"
  SMTP_HOST: "{{ .Values.smtp.host }}"
  SMTP_PORT: "{{ .Values.smtp.port }}"
  SMTP_USER: "{{ .Values.smtp.username }}"
  EMAIL_FROM: "{{ .Values.smtp.from }}"
  EMAIL_TO: "{{ .Values.smtp.to }}"
  {{- if .Values.brevo.templateId }}
  BREVO_TEMPLATE_ID: "{{ .Values.brevo.templateId }}"
  {{- end }}
  {{- if .Values.brevo.listId }}
  BREVO_LIST_ID: "{{ .Values.brevo.listId }}"
  {{- end }}
