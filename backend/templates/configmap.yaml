apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-configmap
  namespace: {{ .Values.namespace }}
data:
  # Keys below MUST match the names read in backend/internal/config/config.go.
  APP_ENV: "{{ .Values.env }}"
  PORT: "{{ .Values.api.port }}"
  DB_PATH: "{{ .Values.database.path }}"
  FRONTEND_ORIGIN: "{{ .Values.frontendOrigin }}"
  SMTP_HOST: "{{ .Values.smtp.host }}"
  SMTP_PORT: "{{ .Values.smtp.port }}"
  SMTP_USER: "{{ .Values.smtp.username }}"
  EMAIL_FROM: "{{ .Values.smtp.from }}"
  EMAIL_TO: "{{ .Values.smtp.to }}"
  {{- if .Values.brevo.templateId }}
  BREVO_TEMPLATE_ID: "{{ .Values.brevo.templateId }}"
  {{- end }}
  {{- if .Values.brevo.listId }}
  BREVO_LIST_ID: "{{ .Values.brevo.listId }}"
  {{- end }}
  {{- if .Values.studio.address }}
  STUDIO_ADDRESS: "{{ .Values.studio.address }}"
  {{- end }}
  {{- if .Values.studio.what3words }}
  STUDIO_WHAT3WORDS: "{{ .Values.studio.what3words }}"
  {{- end }}
  {{- if .Values.telegram.chatId }}
  # Rendered via int64/printf so a numeric chatId in values can't become
  # scientific notation (e.g. 7.077156477e+09) — Telegram needs plain digits.
  TELEGRAM_CHAT_ID: "{{ printf "%d" (int64 .Values.telegram.chatId) }}"
  {{- end }}
  # Site origin Stripe redirects back to after Checkout. Defaults to the
  # frontend origin in the app if left unset here.
  {{- if .Values.publicBaseURL }}
  PUBLIC_BASE_URL: "{{ .Values.publicBaseURL }}"
  {{- else }}
  PUBLIC_BASE_URL: "{{ .Values.frontendOrigin }}"
  {{- end }}
  {{- if .Values.stripe.maintenancePriceId }}
  STRIPE_MAINTENANCE_PRICE_ID: "{{ .Values.stripe.maintenancePriceId }}"
  {{- end }}
