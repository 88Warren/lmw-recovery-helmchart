# secrets.prod.yaml — copy this file, fill in real values, keep it on the VPS only.
# NEVER commit this file. It is git-ignored via .gitignore.
#
# Usage:
#   helm upgrade --install tracker-release ./tracker \
#     --namespace lmw-recovery \
#     -f tracker/secrets.prod.yaml \
#     --reuse-values

secrets:
  basicAuthUser: "your_username"
  basicAuthPass: "your_password"
  googleClientId: "your_google_client_id"
  googleClientSecret: "your_google_client_secret"
