apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-secrets
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: {{ .Release.Name }}
  annotations:
    meta.helm.sh/release-name: {{ .Release.Name }}
    meta.helm.sh/release-namespace: {{ .Values.namespace }}
type: Opaque
# Supply real values at deploy time via secrets.prod.yaml — never commit them.
# stringData lets us provide plain text; Kubernetes base64-encodes it on apply.
stringData:
  {{- if .Values.secrets.basicAuthUser }}
  BASIC_AUTH_USER: {{ .Values.secrets.basicAuthUser | quote }}
  {{- end }}
  {{- if .Values.secrets.basicAuthPass }}
  BASIC_AUTH_PASS: {{ .Values.secrets.basicAuthPass | quote }}
  {{- end }}
  {{- if .Values.secrets.googleClientId }}
  GOOGLE_CLIENT_ID: {{ .Values.secrets.googleClientId | quote }}
  {{- end }}
  {{- if .Values.secrets.googleClientSecret }}
  GOOGLE_CLIENT_SECRET: {{ .Values.secrets.googleClientSecret | quote }}
  {{- end }}
