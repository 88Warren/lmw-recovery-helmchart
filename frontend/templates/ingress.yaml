apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}-ingress
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/managed-by: Helm
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    meta.helm.sh/release-name: {{ .Release.Name }}-ingress
    meta.helm.sh/release-namespace: {{ .Values.namespace }}
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/ssl-certificate: lmwrecovery-ssl
    # HSTS belongs at the TLS-terminating layer. Tells browsers to only ever
    # reach the site over HTTPS for the next 2 years, including subdomains,
    # and makes it eligible for the browser preload list.
    nginx.ingress.kubernetes.io/hsts: "true"
    nginx.ingress.kubernetes.io/hsts-max-age: "63072000"
    nginx.ingress.kubernetes.io/hsts-include-subdomains: "true"
    nginx.ingress.kubernetes.io/hsts-preload: "true"
spec:
  ingressClassName: nginx
  tls: 
    - hosts:
      - {{ .Values.webserver.host | quote }}
      - {{ .Values.webserver.wwwHost | quote }}
      - {{ .Values.api.host | quote }}
      secretName: lmwrecovery-ssl
  rules:
  - host: {{ .Values.webserver.host | quote }}
    http:
      paths:
      - path: {{ .Values.webserver.path }}
        pathType: {{ .Values.webserver.pathType }}
        backend:
          service:
            name: {{ .Release.Name }}-service
            port:
              number: {{ .Values.webserver.port }}
  - host: {{ .Values.api.host | quote }}
    http:
      paths:
      - path: {{ .Values.api.path }}
        pathType: {{ .Values.api.pathType }}
        backend:
          service:
            name: {{ .Values.backendServiceHost }}
            port:
              number: {{ .Values.api.port }}
      - path: /debug/images/
        pathType: {{ .Values.api.pathType }}
        backend:
          service:
            name: {{ .Values.backendServiceHost }}
            port:
              number: {{ .Values.api.port }}
      - path: /images/
        pathType: {{ .Values.api.pathType }}
        backend:
          service:
            name: {{ .Values.backendServiceHost }}
            port:
              number: {{ .Values.api.port }}
     

---
# Dedicated ingress for the www alias. It exists only to 301-redirect
# https://www.lmwrecovery.co.uk → https://lmwrecovery.co.uk so a single
# canonical host is served and indexed. Kept separate from the main ingress
# because the permanent-redirect annotation applies to the whole ingress.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}-www-redirect
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/managed-by: Helm
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    meta.helm.sh/release-name: {{ .Release.Name }}-www-redirect
    meta.helm.sh/release-namespace: {{ .Values.namespace }}
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/ssl-certificate: lmwrecovery-ssl
    # Static target only — the ingress-nginx admission webhook rejects nginx
    # variables (e.g. $request_uri) in this annotation. For a single-page
    # marketing site www has no deep URLs worth preserving, so sending every
    # www request to the canonical apex root is fine.
    nginx.ingress.kubernetes.io/permanent-redirect: "https://{{ .Values.webserver.host }}/"
    nginx.ingress.kubernetes.io/permanent-redirect-code: "301"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
      - {{ .Values.webserver.wwwHost | quote }}
      secretName: lmwrecovery-ssl
  rules:
  - host: {{ .Values.webserver.wwwHost | quote }}
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: {{ .Release.Name }}-service
            port:
              number: {{ .Values.webserver.port }}
