apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-configmap
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/managed-by: Helm
  annotations:
    meta.helm.sh/release-name: {{ .Release.Name }}-configmap
    meta.helm.sh/release-namespace: {{ .Values.namespace }}
data:
  nginx.conf: |
    events {}
    http {
      # Resolve the request Origin to a single allowed value for CORS. The
      # Access-Control-Allow-Origin header may only contain ONE origin, so we
      # echo back the matching one (or empty, which omits the header) rather
      # than a comma-joined list, which is invalid per the CORS spec.
      map $http_origin $cors_allow_origin {
        default                           "";
        "https://lmwrecovery.co.uk"       "https://lmwrecovery.co.uk";
        "https://www.lmwrecovery.co.uk"   "https://www.lmwrecovery.co.uk";
      }

      server {
        listen 5052;
        server_name lmwrecovery.co.uk www.lmwrecovery.co.uk;
        include       /etc/nginx/mime.types;
        default_type  application/octet-stream;

        # ── Security headers ──────────────────────────────────────────
        # Applied to every response this server block serves (the SPA).
        # HSTS is intentionally NOT set here — it belongs on the TLS-
        # terminating ingress (see frontend/templates/ingress.yaml), since
        # this container only ever speaks plain HTTP behind the ingress.
        # Note: nginx replaces (does not merge) inherited add_header
        # directives in a location that declares its own add_header, so the
        # /api/ proxy block below repeats any headers it needs.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
        # Content-Security-Policy tuned to the site's real dependencies:
        #   scripts  — self, Google Tag Manager/Analytics, Stripe
        #   styles   — self + inline (styles are set inline in JSX) + Google Fonts
        #   fonts    — Google Fonts CDN
        #   images   — self, data URIs, and https (GA/Stripe pixels)
        #   connect  — self, the API backend, GA collect endpoint, Stripe API
        #   frames   — Stripe (Checkout/Elements)
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://www.googletagmanager.com https://*.google-analytics.com https://js.stripe.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://api.lmwrecovery.co.uk https://*.google-analytics.com https://*.analytics.google.com https://*.googletagmanager.com https://api.stripe.com; frame-src https://js.stripe.com https://hooks.stripe.com https://maps.google.com https://www.google.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;

        location / {
          root /usr/share/nginx/html;
          index index.html;
          access_log off;
          try_files $uri $uri/ /index.html;
        }

        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
          root /usr/share/nginx/html;
          internal;
        }

        location /api/ {
          proxy_pass https://{{ .Values.backendServiceHost }}:{{ .Values.api.port }}/api/;
          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $scheme;
      
          # CORS: echo back only the single matching allowed origin (see the
          # map block above). Empty when the origin isn't allowed, which omits
          # the header. Note: in practice the browser calls the API host
          # directly, so these apply only if the same-origin /api proxy is used.
          add_header 'Access-Control-Allow-Origin' $cors_allow_origin always;
          add_header 'Vary' 'Origin' always;
          add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
          add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization' always;
          add_header 'Access-Control-Allow-Credentials' 'true' always;
          
          if ($request_method = 'OPTIONS') {
              add_header 'Access-Control-Allow-Origin' $cors_allow_origin always;
              add_header 'Vary' 'Origin' always;
              add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
              add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type' always;
              add_header 'Access-Control-Allow-Credentials' 'true' always;
              add_header 'Content-Type' 'text/plain charset=UTF-8';
              add_header 'Content-Length' '0';
              return 204;
          }

          # Error handling
          proxy_intercept_errors on;
          error_page 502 503 504 /50x.html;
        }

        location /images/ {
          # Serve the frontend's own bundled static images (e.g. /images/studio.jpg)
          # directly from the build. Only if the file does not exist locally do we
          # fall through to the backend, which serves dynamic/uploaded images.
          root /usr/share/nginx/html;
          try_files $uri @backend_images;
        }

        location @backend_images {
          proxy_pass https://{{ .Values.backendServiceHost }}:{{ .Values.api.port }}$request_uri;
          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $scheme;

          # Error handling
          proxy_intercept_errors on;
          error_page 404 /404.html;
        }
        location /debug/images {
          proxy_pass https://{{ .Values.backendServiceHost }}:{{ .Values.api.port }}/debug/images;
          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $scheme;
        }
      }
    }