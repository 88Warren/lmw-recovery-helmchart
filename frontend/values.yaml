namespace: lmw-recovery
env: production
# NOTE: no longer wired into the nginx /api proxy — CORS origins are now
# resolved by a `map` block in configmap.yaml that echoes a single matching
# origin (a comma list is invalid in Access-Control-Allow-Origin). The backend
# API (api.lmwrecovery.co.uk), which the browser actually calls, enforces CORS
# via its FRONTEND_ORIGIN env (see backend/.env.example). Kept for reference.
allowedOrigin: https://www.lmwrecovery.co.uk,https://lmwrecovery.co.uk
replicaCount: 1

image:
  pullPolicy: Always

storage:
  # Cluster uses k3s local-path provisioner (the default StorageClass).
  # The frontend chart has no PVC — this is kept only for consistency.
  storageClass: local-path

webserver:
  image:
    repository: index.docker.io/lmwcode/lmw-recovery-frontend
    tag: v1.0.0
  # nginx listens on this port (see the nginx.conf in configmap.yaml: `listen 5052`).
  port: 5052
  type: NodePort
  # Canonical host that serves the site. Matches the canonical/sitemap/og:url
  # and all structured data in frontend/index.html, which use the bare
  # (non-www) domain. The www host below 301-redirects here so only one
  # version is served and indexed.
  host: lmwrecovery.co.uk
  # The www alias. Covered by the same TLS cert and 301-redirected to the
  # canonical apex host above (see ingress.yaml).
  wwwHost: www.lmwrecovery.co.uk
  path: /
  pathType: Prefix
  applicationType: frontend
  # NOTE: VITE_* values (backend URL, Stripe publishable key, GA id, reCAPTCHA)
  # are baked into the static build at image-build time via frontend/.env.production.
  # They are NOT consumed at runtime, so they are not configured here.

api:
  host: api.lmwrecovery.co.uk
  # Must match the backend service port (backend chart api.port = 8080).
  port: 8080
  path: /api/
  pathType: Prefix
  applicationType: backend

# Backend Service that the nginx /api proxy and the ingress route to.
backendServiceHost: lmwrecovery-backend-service

# Probe tuning. The served path (webserver.path = "/") is what the deployment
# actually probes — nginx serves the SPA there, not an /api/health endpoint.
livenessProbe:
  initialDelaySeconds: 15
  timeoutSeconds: 5
  periodSeconds: 30
  failureThreshold: 3
  successThreshold: 1
readinessProbe:
  initialDelaySeconds: 10
  timeoutSeconds: 5
  periodSeconds: 20
  failureThreshold: 3
  successThreshold: 1
