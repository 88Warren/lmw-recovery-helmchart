name: Deploy Helm Charts

# ── Trigger ───────────────────────────────────────────────────────────────────
# Runs on push to main. Path filters decide which chart(s) redeploy so an edit to
# only the frontend chart doesn't needlessly bounce the backend, and vice versa.
# You can also run it by hand from the Actions tab (workflow_dispatch) and choose
# which chart to deploy.
on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'frontend/**'
  workflow_dispatch:
    inputs:
      target:
        description: 'Which chart to deploy'
        required: true
        default: both
        type: choice
        options: [both, backend, frontend]

# ── Shared config ─────────────────────────────────────────────────────────────
env:
  CHART_DIR:  /opt/lmwrecovery/lmwrecovery-helmcharts
  NAMESPACE:  lmw-recovery
  REPO_URL:   https://github.com/88Warren/lmw-recovery-helmchart.git

concurrency:
  # Never let two chart deploys run at once (SQLite is single-writer; Recreate strategy).
  group: helm-deploy
  cancel-in-progress: false

jobs:
  # ────────────────────────────────────────────────────────────────────────────
  # Decide which charts changed (push) or were requested (manual).
  # ────────────────────────────────────────────────────────────────────────────
  changes:
    name: Detect changed charts
    runs-on: ubuntu-latest
    outputs:
      backend:  ${{ steps.decide.outputs.backend }}
      frontend: ${{ steps.decide.outputs.frontend }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Decide targets
        id: decide
        run: |
          set -eu
          BACKEND=false
          FRONTEND=false

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TARGET="${{ github.event.inputs.target }}"
            case "$TARGET" in
              both)     BACKEND=true; FRONTEND=true ;;
              backend)  BACKEND=true ;;
              frontend) FRONTEND=true ;;
            esac
          else
            BEFORE="${{ github.event.before }}"
            # First push to a branch has an all-zero "before" SHA — fall back to HEAD~1.
            if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
              CHANGED=$(git diff --name-only HEAD~1 HEAD 2>/dev/null || git ls-files)
            else
              CHANGED=$(git diff --name-only "$BEFORE" "${{ github.sha }}")
            fi
            echo "Changed files:"; echo "$CHANGED"
            if echo "$CHANGED" | grep -q '^backend/';  then BACKEND=true;  fi
            if echo "$CHANGED" | grep -q '^frontend/'; then FRONTEND=true; fi
          fi

          echo "backend=$BACKEND"   >> "$GITHUB_OUTPUT"
          echo "frontend=$FRONTEND" >> "$GITHUB_OUTPUT"
          echo "Deploy backend=$BACKEND frontend=$FRONTEND"

  # ────────────────────────────────────────────────────────────────────────────
  # Lint both charts before touching the cluster.
  # ────────────────────────────────────────────────────────────────────────────
  lint:
    name: Lint charts
    runs-on: ubuntu-latest
    needs: changes
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Lint backend
        if: needs.changes.outputs.backend == 'true'
        run: helm lint ./backend

      - name: Lint frontend
        if: needs.changes.outputs.frontend == 'true'
        run: helm lint ./frontend

  # ────────────────────────────────────────────────────────────────────────────
  # Deploy over SSH. The chart lives on the VPS; we git-pull then helm upgrade.
  # Secrets stay on the VPS in backend/secrets.prod.yaml — never in GitHub.
  # --reset-then-reuse-values applies the chart's new values.yaml defaults while
  # preserving explicit overrides from previous deploys (e.g. the image tag set
  # by the app repos' pipelines), so chart edits deploy without rolling the app
  # version back. (Requires Helm >= 3.14; the VPS runs 3.19.)
  # ────────────────────────────────────────────────────────────────────────────
  deploy:
    name: Sync & helm upgrade
    runs-on: ubuntu-latest
    needs: [changes, lint]
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.frontend == 'true'
    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host:     ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key:      ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -euo pipefail

            echo "── Syncing chart repo ──────────────────────────────"
            if [ -d "${{ env.CHART_DIR }}/.git" ]; then
              git -C "${{ env.CHART_DIR }}" fetch --prune origin
              git -C "${{ env.CHART_DIR }}" reset --hard origin/main
            else
              echo "Chart dir is not a git clone — cloning fresh"
              rm -rf "${{ env.CHART_DIR }}.incoming"
              git clone "${{ env.REPO_URL }}" "${{ env.CHART_DIR }}.incoming"
              # Preserve the local secrets file across a reclone
              if [ -f "${{ env.CHART_DIR }}/backend/secrets.prod.yaml" ]; then
                cp "${{ env.CHART_DIR }}/backend/secrets.prod.yaml" "${{ env.CHART_DIR }}.incoming/backend/secrets.prod.yaml"
              fi
              rm -rf "${{ env.CHART_DIR }}"
              mv "${{ env.CHART_DIR }}.incoming" "${{ env.CHART_DIR }}"
            fi

            BACKEND="${{ needs.changes.outputs.backend }}"
            FRONTEND="${{ needs.changes.outputs.frontend }}"

            if [ "$BACKEND" = "true" ]; then
              echo "── Deploying backend chart ───────────────────────"
              SECRETS_ARG=""
              if [ -f "${{ env.CHART_DIR }}/backend/secrets.prod.yaml" ]; then
                SECRETS_ARG="-f ${{ env.CHART_DIR }}/backend/secrets.prod.yaml"
              else
                echo "WARNING: backend/secrets.prod.yaml not found on VPS — reusing previously applied secret values"
              fi
              helm upgrade --install lmwrecovery-backend "${{ env.CHART_DIR }}/backend" \
                --namespace "${{ env.NAMESPACE }}" \
                $SECRETS_ARG \
                --reset-then-reuse-values \
                --wait --timeout 5m
              kubectl -n "${{ env.NAMESPACE }}" rollout status deploy/lmwrecovery-backend-deployment --timeout=180s
            fi

            if [ "$FRONTEND" = "true" ]; then
              echo "── Deploying frontend chart ──────────────────────"
              helm upgrade --install lmwrecovery-frontend "${{ env.CHART_DIR }}/frontend" \
                --namespace "${{ env.NAMESPACE }}" \
                --reset-then-reuse-values \
                --wait --timeout 5m
              kubectl -n "${{ env.NAMESPACE }}" rollout status deploy/lmwrecovery-frontend-deployment --timeout=180s
            fi

            echo "── Done ──────────────────────────────────────────"

      - name: Summary
        if: always()
        run: |
          echo "### Helm chart deploy" >> $GITHUB_STEP_SUMMARY
          echo "| Chart | Deployed |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| backend  | ${{ needs.changes.outputs.backend }} |"  >> $GITHUB_STEP_SUMMARY
          echo "| frontend | ${{ needs.changes.outputs.frontend }} |" >> $GITHUB_STEP_SUMMARY
